name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: vitest + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # package-lock.json is deliberately gitignored in this repo, so `npm ci`
      # cannot be used here.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm run test:run

      # Compile check only — the artifact is discarded. Real deploy builds get
      # their values from the deployment environment.
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://ci.invalid
          VITE_SUPABASE_URL: https://ci.invalid
          VITE_SUPABASE_ANON_KEY: ci-placeholder
