name: Release and Deploy

# Runs on every push to main. Tags a semver release, then deploys — but only
# if deployment secrets are configured, so the run stays green while the
# hosting move is in progress.
#
# Commit message tags: [major] / [minor] control the bump (default: patch).
# GitHub skips this workflow entirely for commits containing [skip ci].

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # package-lock.json is gitignored in this repo, so `npm ci` cannot run.
      - run: npm install --no-audit --no-fund
      - run: npm run test:run

  release:
    name: Tag a version
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.semver.outputs.new_version }}
    steps:
      - name: Checkout code (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get latest tag
        id: get_tag
        run: |
          git fetch --tags
          latest_tag=$(git tag --sort=-v:refname | head -n 1)
          echo "tag=${latest_tag:-v0.1.0}" >> "$GITHUB_OUTPUT"

      - name: Determine version bump
        id: version
        run: |
          bump="patch"
          message=$(git log -1 --pretty=%B)
          if echo "$message" | grep -iqE '\[major\]'; then
            bump="major"
          elif echo "$message" | grep -iqE '\[minor\]'; then
            bump="minor"
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: semver
        run: |
          current=${{ steps.get_tag.outputs.tag }}
          IFS='.' read -r major minor patch <<<"${current#v}"
          bump=${{ steps.version.outputs.bump }}
          case "$bump" in
            major) new_version="$((major + 1)).0.0" ;;
            minor) new_version="$major.$((minor + 1)).0" ;;
            patch) new_version="$major.$minor.$((patch + 1))" ;;
          esac
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit the version bump and tag it
        run: |
          new_version=${{ steps.semver.outputs.new_version }}
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          npm version "$new_version" --no-git-tag-version
          # Only package.json — package-lock.json is gitignored here.
          git add package.json
          git commit -m "chore: bump version to v${new_version} [skip ci]"
          git tag "v${new_version}"
          git push origin HEAD:main
          git push origin "v${new_version}"

  deploy:
    name: Deploy
    needs: release
    runs-on: ubuntu-latest
    # Secrets are lifted into env here because the `secrets` context is not
    # available in a step-level `if:` condition — only `env` is.
    env:
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: "v${{ needs.release.outputs.new_version }}"
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install --no-audit --no-fund

      # The VITE_* values come from the job env above. Without them the bundle
      # ships with an empty API base URL and cannot reach the backend at all.
      - name: Build web assets
        run: npm run build

      - name: Deploy via FTP
        if: env.FTP_HOST != '' && env.VITE_API_BASE_URL != ''
        uses: SamKirkland/FTP-Deploy-Action@4.0.0
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          protocol: ftp
          local-dir: dist/
          server-dir: /

      - name: Deployment summary
        run: |
          if [ -n "$FTP_HOST" ] && [ -n "$VITE_API_BASE_URL" ]; then
            echo "Deployed v${{ needs.release.outputs.new_version }} over FTP." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Tagged v${{ needs.release.outputs.new_version }}. Deploy skipped: set VITE_API_BASE_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY and the FTP_* secrets to enable it." >> "$GITHUB_STEP_SUMMARY"
          fi
